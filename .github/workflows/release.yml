name: Release Please

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest

    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      core_tag: ${{ steps.release.outputs['packages/core--tag_name'] }}
      docs_tag: ${{ steps.release.outputs['packages/quickli-docs--tag_name'] }}

    steps:
      - name: Create or update release PRs
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  release-coverage:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        working-directory: packages/core
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Run tests with coverage
        working-directory: packages/core
        run: python -m pytest --cov=quickli --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: packages/core/coverage.xml
          fail_ci_if_error: false

      - name: Build coverage artifacts
        working-directory: packages/core
        run: |
          python -m coverage html -d htmlcov
          python -m coverage report -m > coverage-summary.txt

      - name: Report coverage on pull request
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: packages/core/coverage-summary.txt
          title: Core Framework Coverage
          badge-title: Coverage
          hide-badge: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-coverage-artifacts
          path: |
            packages/core/coverage.xml
            packages/core/coverage-summary.txt
            packages/core/htmlcov/**

  build-release-evidence:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.core_tag || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set package version from release tag
        if: needs.release-please.outputs.core_tag != ''
        working-directory: packages/core
        env:
          CORE_TAG: ${{ needs.release-please.outputs.core_tag }}
        run: |
          package_version="${CORE_TAG#v}"
          package_version="${package_version#core-v}"
          package_version="${package_version%-core}"
          test -n "${package_version}"
          sed -i "s/^version = \"[^\"]*\"$/version = \"${package_version}\"/" pyproject.toml
          actual_version="$(sed -n 's/^version = "\([^"].*\)"$/\1/p' pyproject.toml)"
          test "${actual_version}" = "${package_version}"
          echo "QUICKLI_VERSION=${package_version}" >> "${GITHUB_ENV}"

      - name: Install core development dependencies
        working-directory: packages/core
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Run core tests with coverage
        working-directory: packages/core
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Build core release evidence
        working-directory: packages/core
        run: |
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov
          python -m coverage report -m > coverage-summary.txt
          python -m build --sdist --wheel
          zip -r htmlcov.zip htmlcov

      - name: Publish core package to PyPI
        if: needs.release-please.outputs.core_tag != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/core/dist/
          print-hash: true
          skip-existing: true

      - name: Create core release evidence summary
        env:
          CORE_TAG: ${{ needs.release-please.outputs.core_tag }}
        run: |
          {
            echo "# Release Evidence"
            echo
            echo "- Core release tag: ${CORE_TAG:-not released}"
            echo "- Core package tests: passed"
            echo "- Core package coverage: see \\`coverage-summary.txt\\`"
          } > release-evidence.md

      - name: Upload core release evidence and publish
        if: needs.release-please.outputs.core_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_TAG: ${{ needs.release-please.outputs.core_tag }}
        run: |
          gh release upload "${CORE_TAG}" \
            packages/core/dist/* \
            packages/core/coverage.xml \
            packages/core/coverage-summary.txt \
            packages/core/htmlcov.zip \
            packages/core/CHANGELOG.md \
            release-evidence.md \
            --clobber
          gh release edit "${CORE_TAG}" --draft=false

  build-documentation:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.core_tag || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation types
        working-directory: packages/quickli-docs
        run: pnpm run typecheck

      - name: Build documentation site
        working-directory: packages/quickli-docs
        env:
          QUICKLI_VERSION: ${{ needs.release-please.outputs.core_tag || 'development' }}
        run: pnpm run build

      - name: Create documentation release evidence summary
        env:
          CORE_TAG: ${{ needs.release-please.outputs.core_tag }}
          DOCS_TAG: ${{ needs.release-please.outputs.docs_tag }}
        run: |
          {
            echo "# Release Evidence"
            echo
            echo "- Core release tag: ${CORE_TAG:-not released}"
            echo "- Documentation release tag: ${DOCS_TAG:-not released}"
            echo "- Documentation typecheck: passed"
            echo "- Documentation build: passed"
          } > release-evidence.md

      - name: Upload documentation site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/quickli-docs/build

      - name: Upload documentation release evidence and publish
        if: needs.release-please.outputs.docs_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_TAG: ${{ needs.release-please.outputs.docs_tag }}
        run: |
          gh release upload "${DOCS_TAG}" \
            packages/quickli-docs/CHANGELOG.md \
            release-evidence.md \
            --clobber
          gh release edit "${DOCS_TAG}" --draft=false

  deploy-documentation:
    needs: build-documentation
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
