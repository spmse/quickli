name: Coverage

on:
  push:
    branches:
      - main
    paths:
      - "packages/core/src/**"
      - "packages/core/tests/**"
      - ".github/workflows/coverage.yml"
  pull_request:
    paths:
      - "packages/core/src/**"
      - "packages/core/tests/**"
      - ".github/workflows/coverage.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        working-directory: packages/core
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Run tests with coverage
        working-directory: packages/core
        run: python -m pytest --cov=quickli --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Build coverage artifacts
        working-directory: packages/core
        run: |
          python -m coverage html -d htmlcov
          python -m coverage report -m > coverage-summary.txt

      - name: Report coverage on pull requests
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: packages/core/coverage-summary.txt
          title: Core Framework Coverage
          badge-title: Coverage
          hide-badge: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: |
            packages/core/coverage.xml
            packages/core/coverage-summary.txt
            packages/core/htmlcov/**
